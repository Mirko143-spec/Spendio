server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx's stock types lack .mjs (pdf.js's worker). Served as octet-stream, the browser refuses
    # to run it (nosniff), so add it on top of the stock list (a `types` block here replaces it).
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback; never cache index.html so updates roll out immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
